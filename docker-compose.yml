version: '3.9'

services:
  backend:
    build:
      context: .
      dockerfile: Dockerfile.backend
    container_name: drf_backend
    command: python manage.py runserver 0.0.0.0:8000
    volumes:
      - ./backend/ecommerce:/app   # map the correct folder
    ports:
      - "8000:8000"
    env_file:
      - ./backend/ecommerce/.env


  frontend:
    build:
      context: .
      dockerfile: Dockerfile.frontend
    container_name: react_frontend
    ports:
      - "3000:80"
    depends_on:
      - backend

